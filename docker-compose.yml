version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zaxi_api
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql://zaxi_user:zaxi_secure_password@postgres:5432/zaxi_prod?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: zaxi_postgres
    restart: always
    environment:
      POSTGRES_USER: zaxi_user
      POSTGRES_PASSWORD: zaxi_secure_password
      POSTGRES_DB: zaxi_prod
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zaxi_user -d zaxi_prod']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zaxi_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    container_name: zaxi_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
